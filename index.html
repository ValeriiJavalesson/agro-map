<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Multi-Area Map Tool</title>
    <!-- Бібліотеки та стилі з папок -->
    <link rel="stylesheet" href="styles/leaflet.css" />
    <!-- <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/mobile.css"> -->
    <!-- <link rel="stylesheet" href="styles/compass.css"> -->
    <link rel="manifest" href="manifest.json">
    <!-- Тема для мобільного браузера -->
    <meta name="theme-color" content="#2c3e50">
    <!-- Налаштування для iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a1a">
    <script>
        (function () {
            // Перевіряємо: тач-екран АБО мобільний браузер
            const isMobile = (
                ('ontouchstart' in window) ||
                (navigator.maxTouchPoints > 0) ||
                /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
            );

            const link = document.createElement('link');
            link.rel = 'stylesheet';
            // Якщо телефон — мобільні стилі, якщо ПК — звичайні
            link.href = isMobile ? 'styles/mobile.css' : 'styles/style.css';
            document.head.appendChild(link);

            // Додаємо клас до body, щоб у JS теж можна було перевіряти
            document.documentElement.classList.add(isMobile ? 'is-mobile' : 'is-desktop');
        })();
    </script>
</head>

<body>
    <!-- Бокова панель -->
    <div id="menuBtn" onclick="toggleSidebar()">☰</div>
    <div id="sidebar">

        <!-- Екран 1: Список всіх полів -->
        <div id="view-list">
            <div class="sidebar-header" style="position: relative; padding-right: 40px;">
                <h3 style="margin: 0; margin-bottom: 10px;">Мої поля</h3>

                <!-- Кнопка закриття (абсолютне позиціонування) -->
                <span onclick="toggleSidebar()">←</span>

                <!-- Контейнер для кнопок у ряд -->
                <div class="header-actions" style="display: flex; gap: 8px; align-items: center;">
                    <button onclick="createNewShape()" class="btn-add" style="flex: 3; margin: 0;">+ Нове</button>

                    <input type="file" id="importInput" accept=".json" style="display: none;"
                        onchange="importData(event)">

                    <button onclick="document.getElementById('importInput').click()" class="btn-import"
                        style="flex: 1; margin: 0;">
                        📥
                    </button>

                    <button onclick="exportData()" class="btn-export-all" style="flex: 1; margin: 0;">
                        💾
                    </button>
                </div>
            </div>

            <div id="shapes-list" style="overflow-y: scroll; height: 25vh;"></div>
        </div>

        <!-- Екран 2: Керування вибраним полем (приховано за замовчуванням) -->
        <!-- Екран 2: Керування вибраним полем -->
        <div id="view-edit" style="display: none;">
            <div class="sidebar-header">
                <button onclick="showListView()" class="btn-back">← До списку</button>
            </div>

            <div class="edit-controls">
                <div class="field-stats-card">
                    <!-- Колір та Назва в один ряд -->
                    <div>
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                            <div class="color-picker-wrapper">
                                <input type="color" id="colorPicker" onchange="updateActiveShapeColor(this.value)">
                            </div>
                            <h6 id="editingFieldName">
                                Назва поля</h6>
                        </div>
                        <div><button id="edit-field-button" onclick="toggleEditField()">✏️</button></div>
                    </div>

                    <div>
                        <div class="stat-row">
                            <span>Площа:</span>
                            <b id="area">0.0000</b>
                        </div>
                        <div class="stat-row">
                            <span>По треку:</span>
                            <b id="trackArea" style="color: #d3a31f;">0.0000</b>
                        </div>
                        <div class="stat-row">
                            <span>Оброблено:</span>
                            <b id="completedArea" class="highlight">0.0000</b>
                        </div>
                    </div>


                </div>

                <div class="edit-field hidden">
                    <div class="input-group">
                        <label>Назва поля:</label>
                        <input type="text" id="shapeNameInput" oninput="updateActiveShapeName(this.value)">
                    </div>

                    <div class="line-settings">
                        <div class="line-inputs-wrapper">
                            <div class="input-mini-group">
                                <label>Колія:</label>
                                <input type="number" id="lineSpacing" value="10" step="0.1" onchange="saveLineParams()">
                            </div>
                            <div class="input-mini-group">
                                <label>Зсув:</label>
                                <input type="number" id="startOffset" value="0" step="0.1" onchange="saveLineParams()">
                            </div>
                            <div class="input-mini-group">
                                <label>Кут ліній:</label>
                                <div style="display: flex; gap: 4px;">
                                    <input type="number" id="manualAngle" value="0" step="0.1"
                                        onchange="saveLineParams()">
                                    <button class="degreeBtn" onclick="setAngleFromGPS()" title="Взяти поточний курс">
                                        📍
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>


                    <div style="display: flex; gap: 8px;">
                        <button onclick="generateLines()" class="btn-primary" style="flex: 2;">Побудувати ☰</button>
                        <button onclick="deleteLines()" class="btn-danger" style="flex: 1;"
                            title="Видалити колії">✕</button>
                    </div>
                    <button onclick="clearTrack()" class="btn-danger-outline" style="width: 100%; margin-top: 8px;">🧹
                        Очистити намальований трек</button>

                    <div class="actions-grid">
                        <button onclick="toggleLock()" id="lockBtn">🔓 Редагувати</button>
                        <button onclick="focusOnShape()">🎯 Центрувати</button>
                        <button onclick="deleteActiveShape()" class="btn-danger-outline"
                            style="grid-column: span 2;">🗑️
                            Видалити все поле</button>

                    </div>
                    <button onclick="exportSingleShape(activeShapeId)" class="btn-primary-outline">📤 Експорт
                        поля</button>

                </div>

            </div>

        </div>

        <div class="sidebar-footer">
        </div>
    </div>
    <div id="compass" class="dark-compass" onclick="resetNorth()">
        <div id="compassArrow" class="compass-axis"></div>
    </div>


    <!-- Мапа -->
    <div id="map">
        <button onclick="toggleMapLayer()" id="layerBtn" class="map-overlay-btn">🛰️</button>
        <button id="trackBtn" onclick="toggleLiveTracking()" disabled class="map-overlay-btn btn-track-map"
            title="Стежити">📍</button>
        <div id="speedometer" class="map-overlay-info">
            <!-- 1. Швидкість -->
            <div style="display: flex; align-items: center;">
                <span id="speedValue">0</span>
            </div>

            <!-- 2. ПЕРЕГОРОДКА (між цифрами) -->
            <div style="width: 1px; height: 4vh; background: #444; margin: 0 12px;"></div>

            <!-- 3. Градуси -->
            <div class="headingContainer">
                <span id="headingValue" style="font-size: 4vh; color: #f1c40f; font-weight: bold;">0</span>
                <sup style="color: #f1c40f; font-size: 2vh; margin-left: 1px; top: -1vh;">°</sup>
            </div>

            <!-- 4. ПЕРЕГОРОДКА (перед кнопкою) -->
            <div style="width: 1px; height: 4vh; background: #444; margin: 0 12px;"></div>

            <!-- 5. КНОПКА КЕРУВАННЯ -->
            <button id="rotateModeBtn" onclick="toggleRotateMode()">
                🧭
            </button>
        </div>


    </div>


    <script src="js/leaflet.js"></script>
    <script src="js/leaflet-rotate-src.js"></script>
    <script src="js/turf.min.js"></script>
    <script src="js/script.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            // Додаємо назву репозиторію до шляху sw.js
            navigator.serviceWorker.register('/agro-map/sw.js')
                .then(() => console.log("PWA Ready"))
                .catch((err) => console.log("PWA Error", err));
        }
    </script>
</body>

</html>
